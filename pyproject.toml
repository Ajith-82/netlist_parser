[tool.poetry]
name = "netlist-parser"
version = "0.2.0"
description = "A Python utility for parsing, analyzing, and manipulating SPICE netlists with support for CDL and hierarchical analysis"
authors = ["Ajith Venugopalan"]
license = "MIT"
readme = "README.md"
packages = [{include = "netlist_parser"}]
keywords = ["spice", "netlist", "cdl", "parser", "eda", "circuit", "analog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
netlist-parser = "netlist_parser.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
